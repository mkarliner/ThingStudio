<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Thingstudio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --border: #2a3140; --text: #d8dee9;
    --dim: #7c8698; --accent: #4f9eff; --good: #4caf50; --bad: #e05555; --warn: #e0a855;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; overflow: hidden; }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  #toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #toolbar h1 { font-size: 13px; font-weight: 600; margin: 0 12px 0 0; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.04em; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  /* Flow name (2026-09-05, "flow identity" -- decisions.md): a plain,
     user-edited label saved in the flow file (flow-file.ts's flowName)
     and sent with every DEPLOY, so a HELLO's currentFlowName can answer
     "is the flow on this device the one I have open" without needing to
     match an opaque deployId against files on disk. */
  #flowNameInput { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-family: inherit; width: 200px; }
  #flowNameInput:focus { outline: none; border-color: var(--accent); }
  /* Connection-mode picker (2026-09-07, editor-backend-wiring): design doc
     §4 requires this be an explicit user choice, never auto-detected --
     these three controls are the "via backend" half of that choice
     (backendUrlInput/backendPortSelect/btnRefreshPorts), hidden via the
     native [hidden] attribute when connModeSelect is set to "direct"
     rather than removed from the DOM, so main.ts can toggle them with a
     plain boolean. */
  #connModeSelect, #backendUrlInput, #backendPortSelect, #flowSelect { background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; }
  #backendUrlInput { width: 170px; }
  #backendPortSelect, #flowSelect { max-width: 220px; }
  .pill { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; }
  .pill.connected { border-color: var(--good); color: var(--good); }
  .pill.disconnected { border-color: var(--bad); color: var(--bad); }

  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; background: #16161a; }
  #rete-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  /* Pane tabs (2026-09-13, multi-pane-canvas.md) -- mount point only,
     no sizing/positioning of its own here: PaneTabs.vue's own scoped
     `#pane-tabs` rule does the actual `position:absolute` pinning to the
     top of #canvas-wrap (this file's own comment on #palette-mount/
     #property-panel-mount explains the general split -- sizing/layout
     that spans regions lives here, a component's own look lives in its
     own scoped style). */
  #pane-tabs-mount { position: relative; }

  /* Palette (left) and property panel (right) mount points -- Phase 3 item
     1/13. Both are standalone Vue apps (main.ts createApp(...).mount(...)),
     not part of the same Vue tree as each other or as the canvas -- see
     main.ts's canvas-construction section header for why this migration
     didn't fold the whole app shell into one Vue root. Sizing/background
     lives here rather than in each component's own scoped style so this
     file stays the one place that lays out the three-region canvas area,
     matching how #sidebar's two .panel children are laid out below. */
  /* overflow-y: auto, 2026-09-17 -- #palette-mount's own box was
     already correctly stretched to #main's height by flex's default
     align-items: stretch (confirmed with a real headless-browser check,
     not assumed), but with no `overflow` rule of its own it stayed at
     the initial `visible` -- so once the palette's node list grew
     tall enough to exceed that box (the display_spi/display_i2c
     addition pushed it over), the excess content just painted past the
     box's own edges, unclipped and NOT scrollable (confirmed:
     `mount.scrollTop = <big number>` was a no-op before this fix, a
     real difference from a merely-hidden scrollbar), rather than
     wrapping into a scroll container -- Mike's "run off the bottom...
     Chrome not showing a scroll bar" report, reproduced and fixed with
     a real before/after check. min-height: 0 added alongside for
     parity with #property-panel-mount/#sidebar's own established
     pattern just below/above, though it wasn't the operative fix here
     (this box's stretched height didn't need it). This rule just never
     got `overflow-y: auto` when the palette mount point was first added
     (Phase 3 item 1/13), because the list was short enough then not to
     visibly overflow. */
  #palette-mount { flex: 0 0 auto; min-height: 0; overflow-y: auto; }
  #property-panel-mount { flex: 0 0 auto; background: var(--panel);
    border-left: 1px solid var(--border); min-height: 0; overflow-y: auto; display: flex; }

  #sidebar { flex: 0 0 420px; display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--border); min-height: 0; overflow-y: auto; padding: 10px; gap: 10px; }
  .panel { background: #10131a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; position: relative; }
  .panel summary { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim);
    margin: 0 0 8px; cursor: pointer; }
  .panel:not([open]) summary { margin: 0; }
  .panel-action { position: absolute; top: 8px; right: 8px; padding: 2px 8px; font-size: 11px; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  #source-preview, #console { background: #0a0c10; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; white-space: pre-wrap; word-break: break-word; line-height: 1.4; max-height: 260px;
    overflow-y: auto; font-size: 11px; }
  #console .t { color: var(--dim); }
  #console .ok { color: var(--good); }
  #console .err { color: var(--bad); }
  /* Console click-to-navigate (2026-09-04): any log line naming a real
     node -- NODE_ERROR, a compile-error attribution, a DEBUG line -- gets
     this class from main.ts's logLine(). Underline is the affordance;
     kept subtle (dotted, not solid) so it doesn't read as a broken link
     or as an error on lines that aren't .err. */
  #console .node-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  #console .node-link:hover { background: #1a1f2b; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Thingstudio</h1>
    <input id="flowNameInput" type="text" placeholder="untitled flow" title="This flow's name -- saved in the flow file, sent with every deploy so you can tell which flow a connected board is running" />
    <button id="clear-canvas">Clear canvas</button>
    <button id="btnSaveFlow" title="Save this flow to a file you choose, via the OS's own save dialog">Save flow…</button>
    <!-- flowSelect/btnRefreshFlows/btnDeleteFlow: backend-managed flow storage, 2026-09-08 for less
         than a day (main.ts's header has the story) -- hidden, not removed, same git-reversible
         posture as connModeOptionDirect below, in case a backend-managed path is wanted again later.
         Flow save/open now go through the OS's native file dialog (file-io.ts); there's nothing for
         these three to list, refresh, or delete against any more. -->
    <select id="flowSelect" title="Flows saved on the backend" hidden><option value="">(no flows loaded)</option></select>
    <button id="btnRefreshFlows" title="Ask the backend for its current list of saved flows" hidden>⟳ flows</button>
    <button id="btnOpenFlow" title="Open a flow file, via the OS's own open dialog">Open flow…</button>
    <button id="btnDeleteFlow" title="Delete the flow selected above from the backend" hidden>Delete flow</button>
    <div class="sep"></div>
    <select id="connModeSelect" title="How the editor reaches your device -- an explicit choice per design doc §4, never auto-detected">
      <!-- "Direct" hidden, not removed, 2026-09-08 (main.ts's own header addendum): storage is
           backend-exclusive now, so this mode can no longer save or load a flow on its own -- kept
           in the DOM/git history for when a real use case brings it back, per this codebase's usual
           "hide, don't delete" posture (e.g. app/nodes.ts, palette.ts's variable_get/variable_set). -->
      <option id="connModeOptionDirect" value="direct" hidden>Direct (WebSerial)</option>
      <option value="backend" selected>Via backend</option>
    </select>
    <input id="backendUrlInput" type="text" value="ws://127.0.0.1:8765/ws" title="Backend WebSocket URL" />
    <select id="backendPortSelect" title="Serial port, as seen by the backend"><option value="">(select port)</option></select>
    <button id="btnRefreshPorts" title="Ask the backend for its current list of serial ports">⟳ ports</button>
    <button id="btnInstallRuntime" title="Push a fresh device-runtime onto the selected port via raw REPL -- for a board with no listener installed yet. Resets the board; reconnect afterward.">Install runtime…</button>
    <button id="btnConnect" class="primary">Connect</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
    <button id="btnCheckStatus" disabled title="Ask the board to resend HELLO -- no reset, no redeploy">Check status</button>
    <button id="btnDeploy" disabled class="primary">Compile → Deploy</button>
    <span id="pill" class="pill disconnected">disconnected</span>
  </div>
  <div id="main">
    <div id="palette-mount"></div>
    <div id="canvas-wrap"><div id="pane-tabs-mount"></div><div id="rete-canvas"></div></div>
    <div id="property-panel-mount"></div>
    <div id="sidebar">
      <details class="panel">
        <summary>Compiled source (preview)</summary>
        <div id="source-preview">—</div>
      </details>

      <details class="panel" open>
        <summary>Device console</summary>
        <button id="btnClear" class="panel-action">Clear</button>
        <div id="console"></div>
      </details>
    </div>
  </div>
</div>

<script type="module" src="/vendor/mpy-cross/load.mjs"></script>
<script type="module" src="/src/app/main.ts"></script>
</body>
</html>
