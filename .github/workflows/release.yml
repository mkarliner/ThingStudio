name: Release

# Builds the self-contained Thingstudio bundles (MVP item 7, step 2): one folder per platform with its own
# Python, archived as .tar.gz (macOS/Linux) or .zip (Windows). Details: tools/make_bundle.py and
# docs/working-notes/packaging-install-routes-briefing.md.
#
# Push a tag vX.Y.Z (matching backend/pyproject.toml's version) -> build, smoke-test every bundle on its
# own platform, and create a DRAFT GitHub Release with the archives and SHA256SUMS. Publishing the draft
# is a manual step, so nothing reaches users without a look first.
# "Run workflow" (workflow_dispatch) -> the same build and smoke tests, archives left as run artifacts, no
# release. Use it to test a change to the packaging without cutting a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  assets:
    name: build editor, docs and assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build_assets.py and vite.config.ts stamp the last commit touching device-runtime/src
      - name: Tag matches backend version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' backend/pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match backend/pyproject.toml version $version. Bump the version, commit, and tag v$version."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build editor
        working-directory: editor
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build docs
        run: |
          pip install -r docs/requirements.txt
          NO_MKDOCS_2_WARNING=1 mkdocs build
      - name: Copy assets into the backend package
        run: python tools/build_assets.py
      - name: Check the installer and launcher scripts
        run: shellcheck -s sh packaging/install.sh packaging/launcher/thingstudio
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: backend/src/thingstudio_backend/_assets
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: bundle ${{ matrix.platform }}
    needs: assets
    strategy:
      fail-fast: false # one platform failing shouldn't hide the others' results
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: windows-x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    env:
      # macOS signing and notarization (packaging step 6) run only when the secrets exist, so forks and
      # pull requests still build, ad-hoc signed. A tag build refuses to go on without them (below).
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: backend/src/thingstudio_backend/_assets
      - name: Releases must be signed on macOS
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') && env.MACOS_SIGNING != 'true'
        run: |
          echo "::error::a tagged release needs the MACOS_CERT_P12/APPLE_API_KEY_P8 secrets; refusing to ship an unsigned macOS build"
          exit 1
      # A throwaway keychain holding only the Developer ID certificate; deleted in the last step.
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::no 'Developer ID Application' identity in MACOS_CERT_P12"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          case "$identity" in
            *"($APPLE_TEAM_ID)") ;;
            *) echo "::error::certificate '$identity' isn't for the team in the APPLE_TEAM_ID secret"; exit 1 ;;
          esac
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Build bundle
        run: python tools/make_bundle.py --platform ${{ matrix.platform }} --out dist
      - name: Smoke test
        shell: bash
        run: python tools/smoke_test_bundle.py dist/thingstudio-*-${{ matrix.platform }}.*
      # Apple notarizes the signed folder (submitted as a zip; a .tar.gz can't be). Nothing is stapled:
      # bare executables can't hold a ticket, so Gatekeeper looks it up online when it checks a quarantined
      # download. The .tar.gz built above holds exactly these signed files.
      - name: Notarize
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          folder=$(ls -d dist/thingstudio-*-${{ matrix.platform }} | head -1)
          ditto -c -k --keepParent "$folder" "$RUNNER_TEMP/notarize.zip"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --wait --timeout 30m \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/notary.json")
          sub_id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/notary.json")
          xcrun notarytool log "$sub_id" "${auth[@]}" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"
          if [ "$status" != Accepted ]; then
            echo "::error::notarization $status (submission $sub_id); Apple's log is above"
            exit 1
          fi
      # The real install.sh against this bundle, from a local "release" folder: fresh install, reinstall over
      # it (the `current` link switch, which differs between GNU and BSD mv), run it, uninstall.
      - name: Installer test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' backend/pyproject.toml | head -1)
          (cd dist && shasum -a 256 thingstudio-*.tar.gz > SHA256SUMS)
          export HOME="$RUNNER_TEMP/installer-home" THINGSTUDIO_VERSION="v$version"
          export THINGSTUDIO_DOWNLOAD_BASE="file://$PWD/dist"
          mkdir -p "$HOME"
          sh packaging/install.sh
          sh packaging/install.sh
          "$HOME/.local/bin/thingstudio" --help > /dev/null
          sh packaging/install.sh --uninstall
          test ! -e "$HOME/.local/share/thingstudio" && test ! -e "$HOME/.local/bin/thingstudio"
          rm dist/SHA256SUMS
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/thingstudio-*.tar.gz
            dist/thingstudio-*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed

  release:
    name: draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      # install.sh goes out with each release, so .../releases/latest/download/install.sh is the stable
      # install URL and the script always matches the archives beside it.
      - name: Checksums
        run: |
          cp packaging/install.sh dist/install.sh
          cd dist && sha256sum thingstudio-* install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "Thingstudio $GITHUB_REF_NAME" --generate-notes \
            --notes "Install and getting started: https://docs.thingstudio.net/getting-started/"
