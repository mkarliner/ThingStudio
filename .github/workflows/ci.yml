name: CI

# Runs what's actually automatable per docs/working-notes/validation/mvp-validation-plan.md:
# off-device tests only. Hardware-in-the-loop tests (test/hil/) need the
# physical witness+DUT rig and stay a manual, documented local gate --
# see docs/working-notes/repo-structure-and-conventions.md's CI section.

on:
  push:
  pull_request:

jobs:
  editor:
    name: editor (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test

  # The installers: install.sh's lint, and install.ps1's tests (packaging/test/, runnable on Linux with the
  # Windows-only steps stood in). The real installs run in release.yml against the built bundles.
  packaging:
    name: installers (shellcheck + install.ps1 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh packaging/install.sh packaging/launcher/thingstudio
      - run: pwsh -NoProfile -File packaging/test/install-ps1.tests.ps1

  # The backend: pytest, including the wire-protocol conformance vectors
  # (backend/test/test_conformance.py) against the shared interfaces/protocol/
  # spec, so the relay can't drift from the editor and device.
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[test]'
      - run: pytest -q
        working-directory: backend

  # The frozen set for the custom classic-ESP32 image is derived from runtime_manifest.py, so it cannot
  # drift -- but staging it still has to succeed, and every library the editor can deploy has to keep
  # compiling with the editor's own mpy-cross (the image's /lib/_deps.json hashes must match what the
  # editor computes, or Deploy pushes copies over the frozen ones). Minutes without a firmware toolchain;
  # the image build itself is firmware.yml, on demand.
  firmware-manifest:
    name: firmware frozen set (stage + _deps.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          python3 firmware/classic-esp32/stage.py firmware/classic-esp32/out/stage
          node firmware/classic-esp32/gen_deps_index.mjs \
            firmware/classic-esp32/out/stage firmware/classic-esp32/out/_deps.json
          python3 - <<'PY'
          import json, os
          idx = json.load(open("firmware/classic-esp32/out/_deps.json"))
          staged = {n[:-3] for n in os.listdir("firmware/classic-esp32/out/stage") if n.endswith(".py")}
          missing = sorted(set(idx) - staged)
          if missing:
              raise SystemExit("indexed but not staged: %s" % ", ".join(missing))
          for name, entry in idx.items():
              if entry["files"]:
                  raise SystemExit("%s: frozen entries must list no files" % name)
          print("%d libraries staged and indexed" % len(idx))
          PY

  # device-runtime: headless MicroPython unix-port tests -- not added yet.
  # They need a MicroPython build (device-runtime/test/README.md: clone,
  # mpy-cross, ports/unix), which is heavier than the rest of CI; the
  # protocol/runtime-api conformance vectors run there and should be wired in
  # (tracked as outstanding-items/enforce-interface-conformance-in-ci.md).
  # Don't run this job against real hardware under any circumstances -- that's
  # test/hil/'s job, and it's deliberately excluded from CI.
