name: CI

# Runs what's actually automatable per docs/working-notes/validation/mvp-validation-plan.md:
# off-device tests only. Hardware-in-the-loop tests (test/hil/) need the
# physical witness+DUT rig and stay a manual, documented local gate --
# see docs/working-notes/repo-structure-and-conventions.md's CI section.

on:
  push:
  pull_request:

jobs:
  editor:
    name: editor (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts
      # A known-vulnerable version is a fact, not a prediction: fail on it rather than let the next release
      # discover it (2026-10-24: six advisories had accumulated since the August lock, two of them high, with
      # every other CI step green). `high`, not `moderate`: the moderates here were test-only, and blocking on
      # those trains people to bypass the gate. If a high ever has no fix, that is an explicit accepted-risk
      # decision in docs/working-notes/, not a step to comment out.
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      # The real bundle, not just the typecheck: tsc does not look inside .vue files, so a stale import
      # path or a missing re-export there only shows up here or at release time (2026-10-22: the
      # display_spi palette editor's import broke the build for a day with every check green).
      - run: npm run build

  # The installers: install.sh's lint, and install.ps1's tests (packaging/test/, runnable on Linux with the
  # Windows-only steps stood in). The real installs run in release.yml against the built bundles.
  packaging:
    name: installers (shellcheck + install.ps1 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck -s sh packaging/install.sh packaging/launcher/thingstudio
      - run: pwsh -NoProfile -File packaging/test/install-ps1.tests.ps1

  # The host-side board tools' off-device tests: test/hil/test_wifi_link.py (see test/hil/README.md) --
  # device_cli's WiFi-transport link and its CLI glue, against an in-process fake board. The hil
  # hardware scripts stay a manual gate; this file is the one that needs no hardware. Pinned set is
  # backend/requirements.txt (pyserial and pytest are already in it).
  host-tools:
    name: host tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: pytest -q test/hil/test_wifi_link.py

  # The backend: pytest, including the wire-protocol conformance vectors
  # (backend/test/test_conformance.py) against the shared interfaces/protocol/
  # spec, so the relay can't drift from the editor and device.
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: pip install --no-deps --no-build-isolation -e ./backend
      - run: pytest -q
        working-directory: backend

  # Custom firmware images, one per firmware/targets/ folder. The frozen set is derived from runtime_manifest.py and
  # is the same for every target, so it cannot drift -- but staging it still has to succeed, and every library the
  # editor can deploy has to keep compiling with the editor's own mpy-cross (the image's frozen inventory hashes
  # must match what the editor computes, or Deploy pushes copies over the frozen ones). Then every target has to be
  # complete and agree with firmware/builds.json, and a target with no tested image at the current runtime version
  # is a warning here (the release workflow refuses the tag for it: decisions/custom-firmware.md, 2026-11-04).
  # Minutes, no firmware toolchain: images are built on a developer machine (firmware/README.md).
  firmware-manifest:
    name: firmware targets (frozen set, catalogue, runtime version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: |
          python3 firmware/stage.py firmware/out/ci/stage
          node firmware/gen_deps_index.mjs firmware/out/ci/stage firmware/out/ci/_deps.json
          python3 - <<'PY'
          import json, os
          idx = json.load(open("firmware/out/ci/_deps.json"))
          stage = "firmware/out/ci/stage"
          # A module (name.py) or, from runtime 15.0.0, a package (name/__init__.py).
          staged = {n[:-3] for n in os.listdir(stage) if n.endswith(".py")}
          staged |= {n for n in os.listdir(stage) if os.path.isfile(os.path.join(stage, n, "__init__.py"))}
          missing = sorted(set(idx) - staged)
          if missing:
              raise SystemExit("indexed but not staged: %s" % ", ".join(missing))
          for name, entry in idx.items():
              if entry["files"]:
                  raise SystemExit("%s: frozen entries must list no files" % name)
          print("%d libraries staged and indexed" % len(idx))
          PY
      - name: every target complete and in step with the catalogue
        run: python3 tools/firmware_catalogue.py --check
      - name: every target has a tested image at the runtime version (warning)
        run: python3 tools/firmware_targets.py current --warn

  # The user guide's checkable style rules (tools/docs_lint.py) against docs/style-lint-baseline.json, a list
  # of today's violations that only shrinks: a new violation fails, and so does a baseline entry whose
  # violation is fixed. Standard library only, so no pip install. Not docs.yml: that one runs on main and deploys.
  docs-lint:
    name: user guide style lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 tools/docs_lint.py
      - run: python3 tools/test_docs_lint.py

  # device-runtime: headless MicroPython unix-port tests -- not added yet.
  # They need a MicroPython build (device-runtime/test/README.md: clone,
  # mpy-cross, ports/unix), which is heavier than the rest of CI; the
  # protocol/runtime-api conformance vectors run there and should be wired in
  # (tracked as outstanding-items/enforce-interface-conformance-in-ci.md).
  # Don't run this job against real hardware under any circumstances -- that's
  # test/hil/'s job, and it's deliberately excluded from CI.
