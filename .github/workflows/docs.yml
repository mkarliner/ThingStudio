name: Docs

# Builds and publishes the end-user documentation site (mkdocs.yml) to
# GitHub Pages via `mkdocs gh-deploy`. Hosting is GitHub Pages "for now"
# per docs/working-notes/documentation-tech-selection.md -- ties CI to
# GitHub specifically, made knowingly against the still-open
# docs/working-notes/outstanding-items/ci-vendor-neutrality.md question,
# not a silent decision.
#
# Separate from ci.yml (editor typecheck/test) -- different toolchain
# (Python/pip, not Node/npm), different trigger scope (docs + mkdocs.yml
# changes only, not every push).

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/user-guide/**"
      - ".github/workflows/docs.yml"
      # The screenshots are taken from the real editor, so editor changes republish the docs too.
      - "editor/**"
      - "docs/screenshots/**"
      - "tools/screenshots.py"
      - "tools/build_llms_txt.py"
      - "tools/mkdocs_llms_hook.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    name: build + gh-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # vite.config.ts stamps the last commit touching device-runtime/src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pins live in docs/requirements.txt and docs/screenshots/requirements.txt and must match
      # docs/third-party-licenses.md's "Documentation build tooling" entry.
      - run: pip install -r docs/requirements.txt -r docs/screenshots/requirements.txt ./backend
      - name: Build editor
        working-directory: editor
        run: |
          npm ci --ignore-scripts
          npm run build
      # Retakes docs/user-guide/images/*.png from the editor just built, replacing the committed copies.
      - name: Screenshots
        run: |
          playwright install --with-deps chromium
          python tools/screenshots.py
      - run: mkdocs gh-deploy --force
