# .github/dependabot.yml
#
# Security updates only. Dependabot raises a PR when a dependency we already hold has a
# published advisory, so the next `npm audit` failure in CI arrives with a fix attached
# instead of being a surprise (2026-10-24: six advisories had accumulated unseen since the
# August lock).
#
# Deliberately NOT version updates. AGENTS.md says never bulk-upgrade -- review dependency
# updates individually -- and this tree is a good example of why: vue is pinned exactly,
# cborg sits on the wire protocol, and vite moves minors that need a real test run. A bot
# opening "bump everything" PRs would be the blind upgrade that rule forbids.
#
# open-pull-requests-limit: 0 turns off version updates. Security update PRs are not counted
# against that limit, so they still arrive, grouped into one PR rather than one per package.
#
# Needs the repo setting too, which a file cannot turn on: Settings -> Code security ->
# Dependabot alerts ON, Dependabot security updates ON.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/editor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
