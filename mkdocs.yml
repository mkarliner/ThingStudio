# Thingstudio end-user documentation site.
# docs/working-notes/documentation-tech-selection.md: MkDocs + Material chosen 2026-09-07.
# docs/working-notes/documentation-design.md: structure/nav decided the same week.
#
# docs_dir points at docs/user-guide/, not docs/ itself -- docs/ also holds
# thingstudio-design-doc.md and working-notes/, both explicitly out of scope
# for this site (contributor-facing material, already served elsewhere).

site_name: Thingstudio
site_url: https://docs.thingstudio.net/
site_description: Node-and-wire visual programming for microcontrollers.
repo_url: https://github.com/mkarliner/ThingStudio
repo_name: mkarliner/ThingStudio

docs_dir: docs/user-guide
site_dir: site

theme:
  name: material
  # No Google Fonts: the backend serves these docs locally (/docs/) and they must work offline.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - md_in_html # <figure markdown> for captioned screenshots
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Background:
      - Event-driven programming: background/event-driven.md
      - Flows, nodes and messages: background/flows-and-nodes.md
      - Node-RED: background/node-red.md
      - MicroPython: background/micropython.md
  - If you already know:
      - Node-RED: coming-from/node-red.md
      - MicroPython: coming-from/micropython.md
      - Arduino and C: coming-from/arduino.md
  - Getting started:
      - 1. Install Thingstudio: getting-started.md
      - 2. Install MicroPython: installing-micropython.md
      - 3. Connect your board: connecting.md
      - 4. Install the runtime: installing-runtime.md
      - 5. Blink an LED: first-flow.md
      - More on installing: installing-more.md
  - Canvas basics: canvas-basics.md
  - Flow lifecycle: flow-lifecycle.md
  - Boards and processors: boards.md
  - Connecting over WiFi: wifi-connection.md
  - Debugging & troubleshooting: debugging.md
  - FAQ: faq.md
  - Node reference:
      - Overview: nodes/index.md
