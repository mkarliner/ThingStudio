<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Thingstudio POC-C (Drawflow variant) — canvas feel spike</title>
<link rel="stylesheet" type="text/css" href="drawflow.min.css" />
<style>
  :root {
    --bg: #1a1a1a; --panel: #232323; --border: #3a3a3a; --text: #ddd; --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  #toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #toolbar h1 { font-size: 13px; font-weight: 600; margin: 0 12px 0 0; color: #888;
    text-transform: uppercase; letter-spacing: 0.04em; }
  #toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  button { background: #333; color: var(--text); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #3d3d3d; border-color: #555; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3a8eef; }
  button.danger { color: #ff8080; }
  #notice { font-size: 11px; color: #f0a840; margin-left: auto; max-width: 380px; }

  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #drawflow { flex: 1 1 auto; position: relative; min-width: 0; background: #161616;
    background-image: radial-gradient(#2a2a2a 1px, transparent 1px); background-size: 18px 18px; }

  #sidebar { flex: 0 0 300px; display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--border); min-height: 0; }
  #sidebar-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #sidebar-header h2 { font-size: 12px; margin: 0; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
  #debug-log { flex: 1 1 auto; overflow-y: auto; padding: 6px 10px; font-size: 11px; }
  .debug-entry { padding: 6px 0; border-bottom: 1px solid #2c2c2c; }
  .debug-time { color: #666; }
  .debug-label { color: var(--accent); }
  .debug-value { color: #b8ffb8; font-family: "SF Mono", Consolas, monospace; }

  /* --- Thingstudio node bodies (all hand-styled — Drawflow ships no widget system) --- */
  .drawflow .drawflow-node { background: #262626; border: 1px solid var(--border); border-radius: 6px;
    padding: 0; min-width: 170px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .drawflow .drawflow-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .ts-title { font-size: 12px; font-weight: 600; padding: 6px 10px; border-bottom: 1px solid #333;
    border-radius: 6px 6px 0 0; display: flex; align-items: center; justify-content: space-between; }
  .ts-body { padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
  .ts-body label { display: flex; flex-direction: column; gap: 2px; color: #999; }
  .ts-body input[type="text"], .ts-body input[type="number"], .ts-body select {
    background: #1a1a1a; border: 1px solid var(--border); border-radius: 3px; color: var(--text);
    font-size: 11px; padding: 3px 5px; }
  .ts-body button { width: 100%; }
  .ts-led { width: 9px; height: 9px; border-radius: 50%; background: #333; display: inline-block;
    border: 1px solid #000; }
  .ts-led.on { background: #57ff57; }
  .ts-last { color: #9aa7ff; font-family: "SF Mono", Consolas, monospace; font-size: 10px; word-break: break-all; }
  .ts-inject .ts-title { background: #2e5c2e; }
  .ts-function .ts-title { background: #6e5b2e; }
  .ts-gpio_out .ts-title { background: #6e3b3b; }
  .ts-mqtt_publish .ts-title { background: #3b3b6e; }
  .ts-debug .ts-title { background: #444; }

  /* flash used when a rejected connection briefly exists before we remove it (see app.js) */
  .drawflow .connection.ts-rejected path { stroke: #ff5050 !important; stroke-dasharray: 4 3; }

  #code-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 1000; }
  #code-modal.open { display: flex; }
  #code-modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    width: 560px; max-width: 90vw; padding: 14px; }
  #code-modal-box h3 { margin: 0 0 8px 0; font-size: 13px; color: #aaa; }
  #code-modal-textarea { width: 100%; height: 260px; background: #111; color: #d8ffd8;
    font-family: "SF Mono", Consolas, monospace; font-size: 12px; border: 1px solid var(--border);
    border-radius: 4px; padding: 8px; resize: vertical; }
  #code-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Thingstudio POC-C — Drawflow variant</h1>
    <button data-add-node="inject">+ inject</button>
    <button data-add-node="function">+ function</button>
    <button data-add-node="gpio_out">+ gpio out</button>
    <button data-add-node="mqtt_publish">+ mqtt out</button>
    <button data-add-node="debug">+ debug</button>
    <div class="sep"></div>
    <button id="load-example" class="primary">Load example flow</button>
    <button id="clear-canvas" class="danger">Clear canvas</button>
    <div id="notice">Same 5 node types &amp; mocks as the Litegraph build, for a direct side-by-side (see poc-c/README.md).</div>
  </div>
  <div id="main">
    <div id="drawflow"></div>
    <div id="sidebar">
      <div id="sidebar-header"><h2>Debug (<span id="debug-count">0</span>)</h2><button id="clear-debug">Clear</button></div>
      <div id="debug-log"></div>
    </div>
  </div>
</div>

<div id="code-modal">
  <div id="code-modal-box">
    <h3>function node — edit code (mock; not executed)</h3>
    <textarea id="code-modal-textarea" spellcheck="false"></textarea>
    <div id="code-modal-actions">
      <button id="code-modal-cancel">Cancel</button>
      <button id="code-modal-save" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="drawflow.min.js"></script>
<script src="app.js"></script>
</body>
</html>
