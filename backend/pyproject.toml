[project]
name = "thingstudio-backend"
version = "0.1.2"
description = "Thingstudio thin local backend: serial<->WebSocket relay, posture-1 Host allowlist, static asset serving."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9,<4",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
thingstudio-backend = "thingstudio_backend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The built editor, docs, device runtime and definitions, copied in by tools/build_assets.py
# (`make assets`). Empty in a dev checkout, which reads them from the repo instead (assets.py).
[tool.setuptools.package-data]
thingstudio_backend = ["_assets/**/*", "example_nodes/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"
