[project]
name = "thingstudio-backend"
version = "0.1.0"
description = "Thingstudio thin local backend: serial<->WebSocket relay, posture-1 Host allowlist, static asset serving."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9,<4",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
thingstudio-backend = "thingstudio_backend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"
