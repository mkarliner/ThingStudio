<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Thingstudio POC-C — canvas feel spike (Litegraph.js)</title>
<link rel="stylesheet" type="text/css" href="litegraph.css" />
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #232323;
    --border: #3a3a3a;
    --text: #ddd;
    --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  #toolbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  #toolbar h1 {
    font-size: 13px; font-weight: 600; margin: 0 12px 0 0;
    color: #888; text-transform: uppercase; letter-spacing: 0.04em;
  }
  #toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  button {
    background: #333; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #3d3d3d; border-color: #555; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3a8eef; }
  button.danger { color: #ff8080; }

  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; }
  #graph-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  #sidebar {
    flex: 0 0 300px;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  #sidebar-header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  #sidebar-header h2 { font-size: 12px; margin: 0; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
  #debug-log { flex: 1 1 auto; overflow-y: auto; padding: 6px 10px; font-size: 11px; }
  .debug-entry { padding: 6px 0; border-bottom: 1px solid #2c2c2c; }
  .debug-time { color: #666; }
  .debug-label { color: var(--accent); }
  .debug-value { color: #b8ffb8; font-family: "SF Mono", Consolas, monospace; }

  #code-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 1000;
  }
  #code-modal.open { display: flex; }
  #code-modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    width: 560px; max-width: 90vw; padding: 14px;
  }
  #code-modal-box h3 { margin: 0 0 8px 0; font-size: 13px; color: #aaa; }
  #code-modal-textarea {
    width: 100%; height: 260px; background: #111; color: #d8ffd8;
    font-family: "SF Mono", Consolas, monospace; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px; padding: 8px; resize: vertical;
  }
  #code-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Thingstudio POC-C</h1>
    <button data-add-node="thingstudio/inject">+ inject</button>
    <button data-add-node="thingstudio/function">+ function</button>
    <button data-add-node="thingstudio/gpio_out">+ gpio out</button>
    <button data-add-node="thingstudio/mqtt_publish">+ mqtt out</button>
    <button data-add-node="thingstudio/debug">+ debug</button>
    <div class="sep"></div>
    <button id="load-example" class="primary">Load example flow</button>
    <button id="clear-canvas" class="danger">Clear canvas</button>
  </div>
  <div id="main">
    <div id="canvas-wrap">
      <canvas id="graph-canvas"></canvas>
    </div>
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>Debug (<span id="debug-count">0</span>)</h2>
        <button id="clear-debug">Clear</button>
      </div>
      <div id="debug-log"></div>
    </div>
  </div>
</div>

<div id="code-modal">
  <div id="code-modal-box">
    <h3>function node — edit code (mock; not executed)</h3>
    <textarea id="code-modal-textarea" spellcheck="false"></textarea>
    <div id="code-modal-actions">
      <button id="code-modal-cancel">Cancel</button>
      <button id="code-modal-save" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="litegraph.min.js"></script>
<script src="nodes.js"></script>
<script src="app.js"></script>
</body>
</html>
